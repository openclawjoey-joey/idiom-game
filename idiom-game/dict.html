<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語字典 📖 — 成語小偵探</title>
<meta name="description" content="成語小偵探完整成語字典，含 100 個常見成語的解釋與生活化例句，按動物、自然、數字人體等分類排列，適合國小學童學習。">
<link rel="stylesheet" href="style.css">
<style>
  .dict-wrap {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .dict-wrap h1 {
    text-align: center;
    font-size: 1.6rem;
    background: linear-gradient(135deg, var(--c1), var(--c4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .dict-wrap .sub { text-align:center; font-size:.82rem; color:var(--t2); margin-bottom:20px; }
  .nav-links { text-align:center; margin-bottom:20px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .nav-links a {
    display:inline-block; padding:6px 16px; border-radius:50px;
    background: var(--card); color: var(--c2); text-decoration: none;
    font-size: .85rem; font-weight:600; box-shadow: var(--sh);
    transition: all .2s;
  }
  .nav-links a:hover { background: var(--c2); color: #fff; }
  .section-title {
    font-size: 1.2rem; font-weight: 700; color: var(--c1);
    margin: 28px 0 12px; padding-bottom: 6px;
    border-bottom: 2px dashed var(--c3);
  }
  .idiom-card {
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--sh);
    padding: 14px 18px;
    margin-bottom: 10px;
    transition: transform .15s;
  }
  .idiom-card:hover { transform: translateX(4px); }
  .idiom-card .iw {
    font-size: 1.15rem; font-weight: 700; color: var(--c1);
    margin-bottom: 4px;
  }
  .idiom-card .iw a { color: var(--c1); text-decoration: none; }
  .idiom-card .iw a:hover { text-decoration: underline; }
  .idiom-card .im { font-size: .88rem; color: var(--t2); line-height: 1.6; }
  .idiom-card .ie { font-size: .85rem; color: var(--c4); margin-top: 4px; }
  .back-top {
    position: fixed; bottom: 24px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--c2); color: #fff; border: none;
    font-size: 1.3rem; cursor: pointer;
    box-shadow: 0 4px 16px rgba(78,205,196,.35);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  .back-top.show { opacity: 1; }
</style>
</head>
<body>

<div class="dict-wrap">
  <h1>📖 成語字典</h1>
  <p class="sub">共 100 個成語 · 按分類排列 · 點擊成語可回到遊戲</p>
  <div class="nav-links">
    <a href="#animal">🐾 動物類 (42)</a>
    <a href="#nature">🌿 自然/物品類 (35)</a>
    <a href="#number">🔢 數字/身體/人物類 (23)</a>
    <a href="index.html">🎮 回遊戲</a>
  </div>

  <div id="dictContent"></div>
</div>

<button class="back-top" id="backTop" title="回到頂端">⬆</button>

<script src="data.js"></script>
<script>
(function(){
  var sections = [
    { key:'animal', title:'🐾 動物類 (42題)', items:[] },
    { key:'nature', title:'🌿 自然 / 物品類 (35題)', items:[] },
    { key:'number', title:'🔢 數字 / 身體 / 人物類 (23題)', items:[] }
  ];

  // Categorize by data.js section — the first 42 entries are animal, next 35 nature, last 23 number/body
  // (match exactly: entries 0-41 = animal, 42-76 = nature, 77-99 = number/body)
  idiomBank.forEach(function(q, i) {
    var cat;
    if (i < 42) cat = 'animal';
    else if (i < 77) cat = 'nature';
    else cat = 'number';
    q._idx = i;
    sections.find(function(s){ return s.key===cat; }).items.push(q);
  });

  var html = '';
  sections.forEach(function(sec) {
    html += '<h2 class="section-title" id="' + sec.key + '">' + sec.title + '</h2>';
    sec.items.forEach(function(q) {
      html += '<div class="idiom-card">' +
        '<div class="iw">' + q.e + ' <a href="index.html#' + q._idx + '">' + q.w + '</a></div>' +
        '<div class="im">📖 ' + q.m + '</div>' +
        '<div class="ie">📝 ' + q.ex.replace(/<b>/g,'「').replace(/<\/b>/g,'」') + '</div>' +
      '</div>';
    });
  });
  document.getElementById('dictContent').innerHTML = html;

  // Back to top
  var btn = document.getElementById('backTop');
  window.addEventListener('scroll', function() {
    btn.classList.toggle('show', window.scrollY > 300);
  });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

</body>
</html>
